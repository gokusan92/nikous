    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto py-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <!-- Treatments Section -->
            <div class="space-y-4">
                <div class="text-lg font-semibold">Treatments</div>
                <div class="flex">
                    <button id="single-btn" class="bg-white hover:bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-l">Single</button>
                    <button id="couple-btn" class="bg-white hover:bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-r">Couple</button>
                </div>
                <div class="bg-white rounded shadow p-4">THAI MASSAGE</div>
                <div class="bg-white rounded shadow p-4">THAI MASSAGE</div>
            </div>

            <!-- Time and Date Section -->
            <div class="space-y-4">
                <div class="flex justify-around">
                    <button class="bg-white hover:bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded">40m | 74€</button>
                    <button class="bg-white hover:bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded">60m | 94€</button>
                </div>
                <div class="bg-white rounded shadow p-4 text-center">SELECT DATE</div>
                <div class="bg-white rounded shadow p-4 text-center">SELECT TIME</div>
            </div>

            <!-- Details and Booking Section -->
            <div class="space-y-4">
                <div class="bg-white rounded shadow p-4 text-center">DETAILS</div>
                <div class="bg-white rounded shadow p-4 text-center">ADD ONS</div>
                <div class="bg-white rounded shadow p-4 text-center">Booking Summary</div>
                <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded w-full">Confirm & pay 4,5$</button>
            </div>
        </div>
    </div>

    <script>
        // JavaScript (For button functionalities)
        document.getElementById('single-btn').addEventListener('click', () => {
            alert('Single booking selected!');
        });

        document.getElementById('couple-btn').addEventListener('click', () => {
            alert('Couple booking selected!');
        });
    </script>
</body>
</html>

</body>
